<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no"
>

<title>Check-in Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #e2e8f0;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: white;
  border-radius: 28px;
  padding: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,.13);
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  color: #17233b;
  font-size: 27px;
}

.header p {
  margin: 7px 0 0;
  color: #64748b;
  font-size: 15px;
}

label {
  display: block;
  margin-bottom: 7px;
  color: #52627a;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  height: 55px;
  padding: 0 16px;
  border: 2px solid #cbd5e1;
  border-radius: 15px;
  outline: none;
  font-size: 17px;
}

input:focus {
  border-color: #4361ee;
}

/* CAMERA */

.camera-box {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: 500px;
  margin-top: 17px;
  overflow: hidden;
  background: #111827;
  border-radius: 22px;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* camera trước nhìn như gương */
#video.front-camera {
  transform: scaleX(-1);
}

/* ảnh vừa chụp */
#photoPreview {
  position: absolute;
  inset: 0;
  z-index: 5;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  background: #111827;
}

/* màn hình bật camera */
.camera-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 25px;
  background: #1e293b;
  color: white;
  text-align: center;
}

.camera-icon {
  font-size: 50px;
  margin-bottom: 10px;
}

.camera-overlay h2 {
  margin: 0 0 8px;
}

.camera-overlay p {
  max-width: 300px;
  margin: 0 0 20px;
  color: #e2e8f0;
  line-height: 1.5;
}

.start-btn {
  padding: 15px 28px;
  border: none;
  border-radius: 15px;
  background: #4361ee;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.start-btn:disabled {
  opacity: .6;
}

/* đổi camera */

.switch-camera {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 7;

  width: 50px;
  height: 50px;

  display: none;

  border: none;
  border-radius: 50%;

  background: rgba(0,0,0,.5);
  color: white;

  font-size: 25px;
  cursor: pointer;
}

.camera-label {
  position: absolute;
  top: 18px;
  left: 15px;
  z-index: 6;

  display: none;

  padding: 7px 12px;

  border-radius: 20px;

  background: rgba(0,0,0,.45);

  color: white;
  font-size: 12px;
}

/* ĐANG LƯU */

.saving-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;

  display: none;

  flex-direction: column;
  justify-content: center;
  align-items: center;

  background: rgba(15,23,42,.72);
  color: white;
}

.spinner {
  width: 44px;
  height: 44px;

  margin-bottom: 15px;

  border: 4px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;

  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.saving-title {
  font-size: 19px;
  font-weight: bold;
}

.saving-subtitle {
  margin-top: 7px;
  color: #e2e8f0;
  font-size: 13px;
}

/* BUTTON */

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 19px;
}

.check-btn {
  flex: 1;
  min-height: 72px;

  border: none;
  border-radius: 17px;

  color: white;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

.check-btn:active {
  transform: scale(.96);
}

.check-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none;
}

.in {
  background: #10b981;
}

.out {
  background: #ef4444;
}

/* STATUS */

.status-box {
  display: none;

  margin-top: 15px;
  padding: 15px;

  border-radius: 14px;

  line-height: 1.6;
  text-align: center;
  font-size: 14px;
}

.status-box.success {
  display: block;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #047857;
}

.status-box.error {
  display: block;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
}

/* TOAST */

.toast {
  position: fixed;

  left: 50%;
  bottom: 25px;

  z-index: 10000;

  max-width: 90%;

  padding: 14px 22px;

  border-radius: 30px;

  color: white;
  font-weight: bold;
  text-align: center;

  opacity: 0;

  transform:
    translateX(-50%)
    translateY(100px);

  transition: .3s;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

.toast.success {
  background: #10b981;
}

.toast.error {
  background: #ef4444;
}

.toast.loading {
  background: #4361ee;
}

/* FLASH */

#flash {
  position: fixed;
  inset: 0;
  z-index: 9999;

  pointer-events: none;

  background: white;

  opacity: 0;

  transition: opacity .08s;
}

/* MOBILE */

@media(max-width:480px) {

  body {
    padding: 4px;
    align-items: flex-start;
  }

  .card {
    padding: 16px;
    border-radius: 23px;
  }

  .header h1 {
    font-size: 24px;
  }

  .header p {
    font-size: 14px;
  }

  .camera-box {
    margin-top: 14px;
    max-height: 470px;
  }

  .buttons {
    gap: 9px;
  }

  .check-btn {
    min-height: 68px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="header">
    <h1>📷 Check-in Studio</h1>
    <p>Hệ thống chấm công tự động</p>
  </div>

  <label for="employeeName">
    HỌ VÀ TÊN NHÂN VIÊN
  </label>

  <input
    id="employeeName"
    type="text"
    placeholder="Nhập tên của bạn..."
    autocomplete="name"
  >

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <img
      id="photoPreview"
      alt="Ảnh vừa chụp"
    >

    <div
      id="cameraLabel"
      class="camera-label"
    >
      CAMERA TRƯỚC
    </div>

    <button
      id="switchCamera"
      class="switch-camera"
      type="button"
      title="Đổi camera"
    >
      🔄
    </button>

    <div
      id="cameraOverlay"
      class="camera-overlay"
    >

      <div class="camera-icon">
        📷
      </div>

      <h2>Camera chấm công</h2>

      <p>
        Bật camera để chụp ảnh
        khi vào ca hoặc ra ca.
      </p>

      <button
        id="startCamera"
        class="start-btn"
        type="button"
      >
        BẬT MÁY ẢNH
      </button>

    </div>

    <div
      id="savingOverlay"
      class="saving-overlay"
    >

      <div class="spinner"></div>

      <div class="saving-title">
        📤 Đang lưu ảnh...
      </div>

      <div class="saving-subtitle">
        Đang gửi lên Google Drive
      </div>

    </div>

  </div>

  <div class="buttons">

    <button
      id="btnIn"
      class="check-btn in"
      type="button"
      disabled
    >
      👋<br>
      VÀO CA
    </button>

    <button
      id="btnOut"
      class="check-btn out"
      type="button"
      disabled
    >
      🏃<br>
      RA CA
    </button>

  </div>

  <div
    id="statusBox"
    class="status-box"
  ></div>

</div>

<canvas
  id="canvas"
  style="display:none;"
></canvas>

<div id="flash"></div>

<div
  id="toast"
  class="toast"
></div>

<iframe
  id="uploadFrame"
  name="uploadFrame"
  style="display:none;"
></iframe>


<script>

// ======================================================
// GOOGLE APPS SCRIPT
// ======================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzUZVIgxyWO3GAgRmDTyXUhTdcdw9ezmXfMc3-69iA_EF9U3ZpA1RN4N_gQglkuWrAy/exec";


// ======================================================
// ELEMENT
// ======================================================

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const photoPreview =
  document.getElementById("photoPreview");

const cameraOverlay =
  document.getElementById("cameraOverlay");

const startCamera =
  document.getElementById("startCamera");

const switchCamera =
  document.getElementById("switchCamera");

const cameraLabel =
  document.getElementById("cameraLabel");

const employeeName =
  document.getElementById("employeeName");

const btnIn =
  document.getElementById("btnIn");

const btnOut =
  document.getElementById("btnOut");

const savingOverlay =
  document.getElementById("savingOverlay");

const statusBox =
  document.getElementById("statusBox");

const toast =
  document.getElementById("toast");

const flash =
  document.getElementById("flash");


// ======================================================
// BIẾN
// ======================================================

let cameraStream = null;

let currentFacing = "user";

let isSaving = false;

let saveStartTime = 0;

let toastTimer = null;

let saveTimeout = null;


// ======================================================
// TOAST
// ======================================================

function showToast(
  message,
  type = "",
  autoHide = true
) {

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toast.textContent = message;

  toast.className =
    "toast show " + type;

  if (autoHide) {

    toastTimer =
      setTimeout(function () {

        toast.classList.remove(
          "show"
        );

      }, 3000);

  }
}


// ======================================================
// STATUS
// ======================================================

function setStatus(html, type) {

  statusBox.className =
    "status-box " + type;

  statusBox.innerHTML =
    html;
}


function clearStatus() {

  statusBox.className =
    "status-box";

  statusBox.innerHTML =
    "";
}


// ======================================================
// MỞ CAMERA
// ======================================================

async function openCamera() {

  try {

    startCamera.disabled = true;

    startCamera.textContent =
      "ĐANG MỞ CAMERA...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Trình duyệt không hỗ trợ Camera."
      );
    }


    // Tắt camera cũ
    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });
    }


    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: currentFacing
            },

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    await video.play();


    updateCameraUI();


    cameraOverlay.style.display =
      "none";


    switchCamera.style.display =
      "block";


    cameraLabel.style.display =
      "block";


    btnIn.disabled =
      false;


    btnOut.disabled =
      false;


    startCamera.disabled =
      false;


    startCamera.textContent =
      "BẬT MÁY ẢNH";


    showToast(
      "✅ Camera đã sẵn sàng!",
      "success"
    );

  }

  catch(error) {

    console.error(
      "Camera Error:",
      error
    );


    startCamera.disabled =
      false;


    startCamera.textContent =
      "BẬT MÁY ẢNH";


    if (
      error.name ===
      "NotAllowedError"
    ) {

      showToast(
        "⚠️ Hãy cho phép sử dụng Camera!",
        "error"
      );

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      showToast(
        "❌ Không tìm thấy Camera!",
        "error"
      );

    }

    else {

      showToast(
        "❌ " + error.message,
        "error"
      );

    }
  }
}


// ======================================================
// CAMERA TRƯỚC / SAU
// ======================================================

function updateCameraUI() {

  if (currentFacing === "user") {

    video.classList.add(
      "front-camera"
    );

    cameraLabel.textContent =
      "CAMERA TRƯỚC";

  }

  else {

    video.classList.remove(
      "front-camera"
    );

    cameraLabel.textContent =
      "CAMERA SAU";

  }
}


// ======================================================
// BẬT CAMERA
// ======================================================

startCamera.addEventListener(
  "click",
  openCamera
);


// ======================================================
// ĐỔI CAMERA
// ======================================================

switchCamera.addEventListener(
  "click",
  async function() {

    if (isSaving) {
      return;
    }


    switchCamera.disabled =
      true;


    currentFacing =
      currentFacing === "user"
        ? "environment"
        : "user";


    try {

      await openCamera();

    }

    finally {

      switchCamera.disabled =
        false;

    }
  }
);


// ======================================================
// VÀO CA
// ======================================================

btnIn.addEventListener(
  "click",
  function() {

    takeSnapshot(
      "VÀO CA"
    );

  }
);


// ======================================================
// RA CA
// ======================================================

btnOut.addEventListener(
  "click",
  function() {

    takeSnapshot(
      "RA CA"
    );

  }
);


// ======================================================
// CHỤP ẢNH
// ======================================================

function takeSnapshot(type) {

  if (isSaving) {
    return;
  }


  const name =
    employeeName.value.trim();


  // Chưa nhập tên
  if (!name) {

    showToast(
      "⚠️ Vui lòng nhập tên nhân viên!",
      "error"
    );

    employeeName.focus();

    return;
  }


  // Camera chưa sẵn sàng
  if (
    !cameraStream ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    showToast(
      "⚠️ Camera chưa sẵn sàng!",
      "error"
    );

    return;
  }


  clearStatus();


  // ====================================================
  // FLASH
  // ====================================================

  flash.style.opacity =
    "0.95";


  setTimeout(function () {

    flash.style.opacity =
      "0";

  }, 80);


  // ====================================================
  // TỐI ƯU ẢNH
  //
  // 400px + JPEG 0.32
  // giúp ảnh nhẹ và upload nhanh hơn.
  // ====================================================

  const MAX_WIDTH =
    400;


  const JPEG_QUALITY =
    0.32;


  let scale =
    MAX_WIDTH /
    video.videoWidth;


  if (scale > 1) {
    scale = 1;
  }


  canvas.width =
    Math.round(
      video.videoWidth *
      scale
    );


  canvas.height =
    Math.round(
      video.videoHeight *
      scale
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  ctx.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  // Chụp ảnh thật.
  // Không lật ảnh lưu.

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Nén ảnh

  const base64Data =
    canvas.toDataURL(
      "image/jpeg",
      JPEG_QUALITY
    );


  // ====================================================
  // HIỆN ẢNH VỪA CHỤP
  // ====================================================

  photoPreview.src =
    base64Data;


  photoPreview.style.display =
    "block";


  // Chỉ hiện 0.3 giây
  setTimeout(function () {

    photoPreview.style.display =
      "none";

  }, 300);


  // ====================================================
  // BẮT ĐẦU LƯU
  // ====================================================

  isSaving =
    true;


  saveStartTime =
    performance.now();


  btnIn.disabled =
    true;


  btnOut.disabled =
    true;


  switchCamera.disabled =
    true;


  employeeName.disabled =
    true;


  savingOverlay.style.display =
    "flex";


  showToast(
    "📤 Đang lưu ảnh...",
    "loading",
    false
  );


  // Kiểm tra dung lượng
  const sizeKB =
    Math.round(
      base64Data.length *
      0.75 /
      1024
    );


  console.log(
    "Dung lượng ảnh:",
    sizeKB + " KB"
  );


  // ====================================================
  // TIMEOUT 15 GIÂY
  // ====================================================

  if (saveTimeout) {
    clearTimeout(saveTimeout);
  }


  saveTimeout =
    setTimeout(function () {

      if (!isSaving) {
        return;
      }


      isSaving =
        false;


      savingOverlay.style.display =
        "none";


      btnIn.disabled =
        false;


      btnOut.disabled =
        false;


      switchCamera.disabled =
        false;


      employeeName.disabled =
        false;


      showToast(
        "⚠️ Máy chủ phản hồi quá lâu!",
        "error"
      );


      setStatus(

        "⚠️ <b>Chưa nhận được xác nhận.</b>" +

        "<br>" +

        "Ảnh có thể đã được gửi lên Google Drive." +

        "<br>" +

        "Hãy kiểm tra Google Sheet trước khi chấm công lại.",

        "error"

      );

    }, 15000);


  // Gửi ngay lập tức
  sendToAppsScript(
    name,
    type,
    base64Data
  );
}


// ======================================================
// GỬI APPS SCRIPT
// ======================================================

function sendToAppsScript(
  name,
  type,
  base64Data
) {

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    SCRIPT_URL;


  form.target =
    "uploadFrame";


  form.style.display =
    "none";


  // TÊN

  const nameField =
    document.createElement(
      "input"
    );


  nameField.type =
    "hidden";


  nameField.name =
    "employeeName";


  nameField.value =
    name;


  // LOẠI

  const typeField =
    document.createElement(
      "input"
    );


  typeField.type =
    "hidden";


  typeField.name =
    "type";


  typeField.value =
    type;


  // ẢNH

  const imageField =
    document.createElement(
      "textarea"
    );


  imageField.name =
    "base64Data";


  imageField.value =
    base64Data;


  imageField.style.display =
    "none";


  form.appendChild(
    nameField
  );


  form.appendChild(
    typeField
  );


  form.appendChild(
    imageField
  );


  document.body.appendChild(
    form
  );


  // Gửi ngay
  form.submit();


  setTimeout(function () {

    form.remove();

  }, 1000);
}


// ======================================================
// NHẬN XÁC NHẬN TỪ APPS SCRIPT
// ======================================================

window.addEventListener(
  "message",
  function(event) {

    if (
      !event.data ||
      event.data.type !==
        "CHECKIN_RESULT"
    ) {

      return;
    }


    const result =
      event.data.data;


    // Hủy timeout
    if (saveTimeout) {

      clearTimeout(
        saveTimeout
      );

      saveTimeout =
        null;
    }


    const seconds =
      (
        (
          performance.now() -
          saveStartTime
        ) /
        1000
      ).toFixed(1);


    // ==================================================
    // MỞ KHÓA
    // ==================================================

    isSaving =
      false;


    savingOverlay.style.display =
      "none";


    btnIn.disabled =
      false;


    btnOut.disabled =
      false;


    switchCamera.disabled =
      false;


    employeeName.disabled =
      false;


    // ==================================================
    // THÀNH CÔNG
    // ==================================================

    if (
      result &&
      result.success === true
    ) {

      showToast(
        "✅ Ảnh đã được lưu!",
        "success"
      );


      setStatus(

        "✅ <b>" +
        result.type +
        " THÀNH CÔNG!</b>" +

        "<br>" +

        "📸 Ảnh đã được lưu vào Google Drive" +

        "<br>" +

        "👤 " +
        result.employeeName +

        "<br>" +

        "📅 " +
        result.date +

        " &nbsp; 🕐 " +
        result.time +

        "<br>" +

        "⚡ Lưu trong " +
        seconds +
        " giây",

        "success"

      );


      console.log(
        "ĐÃ LƯU THÀNH CÔNG:",
        result
      );

    }


    // ==================================================
    // THẤT BẠI
    // ==================================================

    else {

      let message =
        "Không thể lưu ảnh.";


      if (
        result &&
        result.message
      ) {

        message =
          result.message;
      }


      showToast(
        "❌ Lưu ảnh thất bại!",
        "error"
      );


      setStatus(

        "❌ <b>LƯU THẤT BẠI</b>" +

        "<br>" +

        message +

        "<br>" +

        "Vui lòng thử lại.",

        "error"

      );
    }
  }
);


// ======================================================
// TẮT CAMERA KHI RỜI TRANG
// ======================================================

window.addEventListener(
  "beforeunload",
  function() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });
    }
  }
